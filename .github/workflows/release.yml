# Publishes to PyPI when a version tag is pushed (git tag v0.1.0 && git push origin v0.1.0).
# Uses PyPI Trusted Publishing: no token is stored; PyPI trusts this workflow file in
# EmbodiedRuntime/roborun, run in the GitHub environment named below. The workflow file name
# and the environment must match what is configured on PyPI.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Check that the tag matches the package version
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi
      - run: uv venv --python 3.12
      - run: uv pip install -e ".[dev]"
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/roborun/
    permissions:
      id-token: write  # the short-lived credential PyPI accepts; nothing else
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
