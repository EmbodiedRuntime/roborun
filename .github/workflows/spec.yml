name: Spec

# The TLA+ models (spec/README.md). TLC takes about half an hour on a hosted runner, so
# this runs only when the models or the specification change.
on:
  push:
    branches: [main]
    paths: ["spec/**", "SPEC.md", ".github/workflows/spec.yml"]
  pull_request:
    paths: ["spec/**", "SPEC.md", ".github/workflows/spec.yml"]

jobs:
  tlc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v4
        with:
          path: spec/.tools
          key: tlc-${{ hashFiles('spec/check.sh') }}
      - run: spec/check.sh
