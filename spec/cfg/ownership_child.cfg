\* A child that uses its parent's token, with a waiter, a taker and a second actuator.
CONSTANTS
  w1 = w1  w2 = w2  g = g  f = f  k1 = k1  k2 = k2  k3 = k3  kb = kb  c = c
  arm = arm  grip = grip  s1 = s1  s2 = s2  None = None
  Tasks = {w2, c, w1, g, k1}
  Actuators = {arm, grip}
  Needs <- MCNeeds  Mode <- MCMode  Session <- MCSession  Supervises <- MCSupervises  Parent <- MCParent
  Repeating = {}  Impatient = {}
  TakeFront = TRUE  TakeCancels = TRUE  ConfirmStop = TRUE  FailOnReserved = TRUE  Reserve = TRUE  ChildReject = TRUE  ChildStop = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK OwnershipConsistent QueueConsistent RevokedIsCancelling FailNeverWaits OneTaker
PROPERTIES NoOvertake CancelledAtRest TakeDirect NoCommandWhenCancelled
CHECK_DEADLOCK FALSE
