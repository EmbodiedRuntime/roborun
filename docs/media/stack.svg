<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 274" width="900" height="274" role="img" aria-label="Policies are programs (from a single tool call to full code, written by people or generated by models) or end-to-end models (VLA, world action models); they may be slow or wrong. Robots, in simulation or the real world, are continuous and irreversible. roborun sits between them: Task makes every running activity owned by whoever started it and stoppable, World holds shared, time-stamped state, Gate checks every command, and Trace records what ran, on which data.">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
.band{fill:#f6f8fa;stroke:#d1d9e0}.bandcore{fill:#e8edff;stroke:#2848d8;stroke-width:1.5}
.chip{fill:#ffffff;stroke:#d1d9e0}.chipcore{fill:#ffffff;stroke:#2848d8;stroke-width:1.5}
.planned{fill:none;stroke:#8c959f;stroke-dasharray:4 3}
.lab{font-size:13px;font-weight:700;fill:#59636e}.labcore{font-size:17px;font-weight:800;fill:#2848d8}
.c{font-size:14px;font-weight:600}.note{font-size:12px;font-style:italic;fill:#59636e}.cc{font-size:15px;font-weight:700}.cs{font-size:11px;fill:#59636e}
.dim{fill:#8c959f}
@media (prefers-color-scheme: dark){text{fill:#e6edf3}.band{fill:#151b23;stroke:#3d444d}
.bandcore{fill:#18224f;stroke:#7b8fff}.chip{fill:#0d1117;stroke:#3d444d}.chipcore{fill:#0d1117;stroke:#7b8fff}
.planned{stroke:#6e7681}.lab,.cs,.note{fill:#9198a1}.labcore{fill:#7b8fff}.dim{fill:#6e7681}}
</style>
<rect class="band" x="2" y="8" width="896" height="78" rx="12"/>
<text class="lab" x="20" y="43.0">Policies</text>
<text class="note" x="20" y="61.0">may be slow or wrong</text>
<rect class="chip" x="186.0" y="22" width="345.0" height="50" rx="8"/>
<text class="c" x="358.5" y="43" text-anchor="middle">Programs</text>
<text class="cs" x="358.5" y="61" text-anchor="middle">a tool call or full code, written or generated</text>
<rect class="chip" x="541.0" y="22" width="345.0" height="50" rx="8"/>
<text class="c" x="713.5" y="43" text-anchor="middle">End-to-end models</text>
<text class="cs" x="713.5" y="61" text-anchor="middle">VLA · WAM</text>
<rect class="bandcore" x="2" y="92" width="896" height="92" rx="12"/>
<text class="labcore" x="20" y="143.0">roborun</text>
<rect class="chipcore" x="186.0" y="106" width="167.5" height="64" rx="8"/>
<text class="cc" x="269.75" y="133" text-anchor="middle">Task</text>
<text class="cs" x="269.75" y="153" text-anchor="middle">owned, stoppable activity</text>
<rect class="chipcore" x="363.5" y="106" width="167.5" height="64" rx="8"/>
<text class="cc" x="447.25" y="133" text-anchor="middle">World</text>
<text class="cs" x="447.25" y="153" text-anchor="middle">shared, time-stamped state</text>
<rect class="chipcore" x="541.0" y="106" width="167.5" height="64" rx="8"/>
<text class="cc" x="624.75" y="133" text-anchor="middle">Gate</text>
<text class="cs" x="624.75" y="153" text-anchor="middle">checks every command</text>
<rect class="chipcore" x="718.5" y="106" width="167.5" height="64" rx="8"/>
<text class="cc" x="802.25" y="133" text-anchor="middle">Trace</text>
<text class="cs" x="802.25" y="153" text-anchor="middle">what ran, on which data</text>
<rect class="band" x="2" y="190" width="896" height="78" rx="12"/>
<text class="lab" x="20" y="225.0">Robots</text>
<text class="note" x="20" y="243.0">continuous, irreversible</text>
<rect class="chip" x="186.0" y="204" width="345.0" height="50" rx="8"/>
<text class="c" x="358.5" y="234.0" text-anchor="middle">Simulation</text>
<rect class="chip" x="541.0" y="204" width="345.0" height="50" rx="8"/>
<text class="c" x="713.5" y="234.0" text-anchor="middle">Real world</text>
</svg>
