<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 440" width="990" height="440" role="img" aria-label="Failures by the part of roborun that prevents them, with no runtime, with roborun, and with one part switched off. Every failure happens with no runtime and none with roborun; switching off one part brings back exactly the failures that part prevents.">
